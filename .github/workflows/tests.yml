name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m pip check
      - run: python -m unittest discover -v
      - run: python check_docs.py
      - run: python -m pip install setuptools==84.0.0 wheel==0.48.0
      - run: python verify_install.py
      - run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - run: python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*
      - name: Prepare integration material
        run: python -c "from pathlib import Path; p=Path('.integration-material'); p.mkdir(); (p/'sample.txt').write_text('safe', encoding='utf-8')"
      - name: Exercise local composite Action
        uses: ./
        with:
          directory: .integration-material
          report: ${{ runner.temp }}/guard-action-${{ strategy.job-index }}.json
      - name: Install pre-commit test runner
        run: python -m pip install pre-commit==4.3.0
      - name: Verify pre-commit hook
        run: python verify_hook.py
      - name: Prepare finding material
        run: python -c "from pathlib import Path; Path('.integration-material/sample.txt').write_text('10.1.2.3', encoding='utf-8')"
      - name: Verify Action finding fails
        id: finding_action
        continue-on-error: true
        uses: ./
        with:
          directory: .integration-material
          report: ${{ runner.temp }}/guard-action-finding-${{ strategy.job-index }}.json
      - name: Assert expected failure
        env:
          ACTUAL_OUTCOME: ${{ steps.finding_action.outcome }}
          ACTUAL_CODE: ${{ steps.finding_action.outputs.exit-code }}
        run: python -c "import os; assert os.environ['ACTUAL_OUTCOME'] == 'failure'; assert os.environ['ACTUAL_CODE'] == '1'"
