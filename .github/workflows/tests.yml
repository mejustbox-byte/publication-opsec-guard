name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m pip check
      - run: python -m unittest discover -v
      - run: python check_docs.py
      - run: python -m pip install setuptools==84.0.0 wheel==0.48.0
      - run: python verify_install.py
      - run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - run: python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*
