[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "publication-opsec-guard"
version = "0.2.0a4"
description = "Offline read-only publication disclosure checks for UTF-8 text"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Publication OPSEC Guard contributors"}]
dependencies = []

[project.optional-dependencies]
validation = ["attrs==26.1.0", "jsonschema==4.26.0", "jsonschema-specifications==2025.9.1", "referencing==0.37.0", "rpds-py==2026.9.1", "typing_extensions==4.16.0"]

[project.scripts]
publication-opsec-guard = "publication_opsec_guard.guard:main"
publication-opsec-validate = "publication_opsec_guard.validate_report:main"

publication-opsec-secrets = "publication_opsec_guard.secrets:main"

[tool.setuptools]
packages = ["publication_opsec_guard", "publication_opsec_guard_schemas"]

[tool.setuptools.package-dir]
publication_opsec_guard_schemas = "schemas"

[tool.setuptools.package-data]
publication_opsec_guard_schemas = ["*.json"]
